name: Space Keep Alive (Fully Optimized)
on:
  schedule:
    - cron: '0 * * * *' 

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    # 1. Cache Node Packages to prevent re-installing npm modules every hour
    - name: Cache Node Modules
      id: npm-cache
      uses: actions/cache@v4
      with:
        path: node_modules
        key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') || 'keepalive-v1' }}

    - name: Install Playwright Dependency
      if: steps.npm-cache.outputs.cache-hit != 'true'
      run: npm install playwright

    # 2. Cache the underlying Chromium Browser binary
    - name: Cache Playwright Browser
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('node_modules/playwright/package.json') || 'browser-v1' }}

    - name: Install Playwright Browser Binary
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install chromium

    # 3. Execute light-weight headless runner
    - name: Run Authenticated Keep Alive Script
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }} 
      run: |
        node -e "
        const { chromium } = require('playwright');
        (async () => {
          // Launch with resource-saving arguments
          const browser = await chromium.launch({
            args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage']
          });
          const context = await browser.newContext();
          
          await context.setExtraHTTPHeaders({
            'Authorization': 'Bearer ' + process.env.HF_TOKEN
          });
          
          const page = await context.newPage();

          // Block heavy assets (images, stylesheets, fonts) to minimize CPU and RAM
          await page.route('**/*', (route) => {
            const type = route.request().resourceType();
            if (['image', 'stylesheet', 'font', 'media'].includes(type)) {
              route.abort();
            } else {
              route.continue();
            }
          });
          
          console.log('Visiting private webpage efficiently...');
          await page.goto('https://cosmoshare.pages.dev/oneshare', { waitUntil: 'domcontentloaded' });
          
          // Maintain the light WebSocket / Socket.io channel for 15 minutes
          await page.waitForTimeout(900000); 
          
          await browser.close();
          console.log('Session finished successfully!');
        })();
        "
